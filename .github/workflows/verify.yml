name: Verify Deeplake
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deeplake
          POSTGRES_PASSWORD: deeplake-test-only
          POSTGRES_DB: deeplake_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U deeplake -d deeplake_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://deeplake:deeplake-test-only@localhost:5432/deeplake_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:architecture
      - run: pnpm demo
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
