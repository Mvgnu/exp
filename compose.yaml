services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: deeplake
      POSTGRES_USER: deeplake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U deeplake -d deeplake]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: {context: ., target: runtime}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://deeplake:${POSTGRES_PASSWORD}@postgres:5432/deeplake
      DEEPLAKE_DATA_DIR: /data
      DEEPLAKE_HOST: 0.0.0.0
      DEEPLAKE_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes: [blobs:/data]
    ports: [127.0.0.1:4310:4310]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: {context: ., target: runtime}
    command: [pnpm, worker]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://deeplake:${POSTGRES_PASSWORD}@postgres:5432/deeplake
      DEEPLAKE_DATA_DIR: /data
    volumes: [blobs:/data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  workbench:
    build: {context: ., target: workbench}
    ports: [127.0.0.1:8080:80]
    depends_on: [api]
    restart: unless-stopped
  catalog:
    build: {context: ., target: catalog}
    ports: [127.0.0.1:8081:80]
    restart: unless-stopped
volumes:
  postgres:
  blobs:
